server:
  port: 8083

spring:
  application:
    name: orchestrator-worker

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${DB_USERNAME:sentinel}
    password: ${DB_PASSWORD:sentinel}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        # Free-tier key from https://aistudio.google.com/apikey
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.2

sentinel:
  mcp:
    scanner-server-url: ${SCANNER_MCP_URL:http://localhost:8081}
    remediation-server-url: ${REMEDIATION_MCP_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.sentinel: INFO
